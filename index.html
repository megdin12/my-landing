<!doctype html>
<html>
  <head>
    <title>Мой сайт</title>
    <style>
      .btn {
        background-color: #007bff;
        padding: 12px 24px;
        border-radius: 20px;
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
      .btn:hover {
        background-color: #3e8e41;
      }
      header {
        display: flex;
        justify-content: space-between;
      }
      .cards {
        display: flex;
        gap: 20px;
      }
      .card {
        background: #ffffff;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <header>
      <div>Мой бренд</div>
      <nav>
        <a>Главная</a>
        <a>О нас</a>
        <a>Контакты</a>
      </nav>
    </header>
    <section>
      <h1>Создаю сайты, которые будут работать</h1>
      <p>Разработка,дизайн,поддержка</p>

      <a href="#" class="btn">Перейти на сайт</a>
    </section>
    <section>
      <h2>Мои услуги</h2>
      <div class="cards">
        <div class="card">
          <!-- Карточка 1 -->
          <h3>Вёрстка</h3>
          <p>Превращаю макеты в удобный HTML-код</p>
        </div>
        <div class="card">
          <!-- Карточка 2 -->
          <h3>Дизайн</h3>
          <p>Создаю удобные и красивые интерфейсы</p>
        </div>
        <div class="card">
          <!-- Карточка 3 -->
          <h3>Поддержка</h3>
          <p>Помогаю с обновлениями и доработками</p>
        </div>
      </div>
    </section>
  </body>
</html>
